name: OpenSSF Scorecard

# Thin caller: the analysis job lives in the control plane
# (Icaro0310/devin-powerups/.github/workflows/scorecard.yml @v1).
# The uses: job must grant every scope the reusable requests.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: Icaro0310/devin-powerups/.github/workflows/scorecard.yml@v1
