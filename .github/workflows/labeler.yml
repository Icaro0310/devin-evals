name: pr-labeler

# Thin caller: the label job lives in the control plane
# (Icaro0310/devin-powerups/.github/workflows/labeler.yml @v1).
# This runs on pull_request_target — never check out PR code here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: Icaro0310/devin-powerups/.github/workflows/labeler.yml@v1
