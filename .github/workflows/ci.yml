name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  corpus:
    # Golden-case gate (EV-3): generated fixtures only — never real sessions.
    # The generator is devin_evals.dream (devin-dream absorbed in P4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check committed corpus is in sync
        run: python tools/regen-corpus.py --check

      - name: Materialize corpus dbs (synthetic)
        run: devin-evals corpus generate --out corpus

      - name: Verify corpus (expected-vs-actual)
        run: devin-evals corpus verify --corpus corpus

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan for secret-looking strings
        run: |
          set -e
          PATTERNS='(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{16,})'
          # dream fixtures intentionally embed the public AWS docs
          # example key (AKIAIOSFODNN7EXAMPLE) — exclude that known fixture.
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=fixtures --exclude-dir=node_modules . | grep -v 'AKIAIOSFODNN7EXAMPLE'; then
            echo "::error::Secret-looking content found. Sanitize before merging."
            exit 1
          fi
          echo "No secret-looking content found."
